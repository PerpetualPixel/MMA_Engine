name: Build consensus

on:
  workflow_dispatch:
    inputs:
      discover_only:
        description: "Dry run: list the videos discovery finds, then stop"
        type: boolean
        default: false
      skip_extraction:
        description: "Fetch transcripts only (no Claude API calls)"
        type: boolean
        default: false
      roster_video_url:
        description: "Optional: run --roster-from on this video URL instead of the normal pipeline (diagnostic / one-off roster update)"
        type: string
        default: ""
  # No `schedule:` trigger. GitHub's shared runners sit on cloud IP ranges
  # YouTube blocks outright, and running unattended here requires a paid
  # residential proxy (see README.md "Running unattended on GitHub Actions").
  # Until that's set up, the weekly run happens locally instead — see
  # README.md "Weekly workflow". Add back a `schedule:` block here once a
  # working residential proxy is in place.

permissions:
  contents: write

concurrency:
  group: consensus
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Transcript and extraction caches survive between runs, so re-runs only
      # pay for videos that are actually new.
      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: cache
          key: mma-cache-${{ github.run_id }}
          restore-keys: mma-cache-

      - name: Extract roster from a tracker video
        if: ${{ inputs.roster_video_url != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: src
          # GitHub-hosted runners sit on cloud IP ranges YouTube blocks outright,
          # so transcript/RSS requests must go through a residential proxy here.
          # See README.md "Running unattended on GitHub Actions" for setup.
          MMA_PROXY_ENABLED: "true"
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
        run: |
          python -m mma_engine \
            --config config.json \
            --roster-from "${{ inputs.roster_video_url }}"

      - name: Build consensus
        if: ${{ inputs.roster_video_url == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: src
          MMA_PROXY_ENABLED: "true"
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
        run: |
          python -m mma_engine \
            --config config.json \
            --output docs/data.json \
            ${{ inputs.discover_only && '--discover-only' || '' }} \
            ${{ inputs.skip_extraction && '--skip-extraction' || '' }}

      - name: Upload roster proposal
        if: ${{ inputs.roster_video_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: roster_proposal
          path: roster_proposal.json

      - name: Commit updated data.json
        # A dry run writes no output, so there is nothing to commit.
        if: ${{ !inputs.discover_only && inputs.roster_video_url == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data.json; then
            echo "No consensus changes to commit."
            exit 0
          fi
          git add docs/data.json
          git commit -m "chore: refresh consensus data"
          git push
