<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MMA Consensus Engine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%A5%8A</text></svg>" />
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2430;
    --border: #2b3440;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #f0883e;
    --strong: #3fb950;
    --strong-dim: #1d3325;
    --weak: #6e7681;
    --split: #d29922;
    --split-dim: #33290f;
    --dog: #f0883e;
    --gold: #e3b341;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 18px 80px; }

  header { padding-bottom: 6px; }
  h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .event-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-top: 8px; }
  .event { font-size: 18px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 12px; }

  /* -- tabs -- */
  nav.tabs {
    display: flex; gap: 4px; flex-wrap: wrap; margin: 16px 0 18px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--bg); z-index: 5; padding-top: 6px;
  }
  nav.tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-weight: 600; font-size: 14px;
    padding: 8px 12px; cursor: pointer;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* -- controls -- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
  }
  .controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
  .controls label:hover { color: var(--text); }
  .controls select, .controls input[type=range] { accent-color: var(--accent); }
  .controls select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font: inherit;
  }
  .controls input[type=search] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font: inherit; width: 170px;
  }
  .controls input[type=search]:focus { outline: none; border-color: var(--accent); }
  .controls .hint { color: var(--weak); font-size: 12px; }
  .count-note { color: var(--muted); font-size: 12px; margin: -8px 0 12px 2px; }

  /* -- fight card, two sides -- */
  .duel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 14px; overflow: hidden;
  }
  .duel > h2 {
    margin: 0; padding: 10px 16px 8px; font-size: 15px; font-weight: 700;
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline;
  }
  .duel > h2 .badges { display: flex; gap: 6px; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
  }
  .badge.lock { color: var(--gold); border-color: var(--gold); }
  .badge.pickem { color: var(--split); border-color: var(--split); }
  .badge.dog { color: var(--dog); border-color: var(--dog); }
  .badge.cancelled { color: var(--danger, #f85149); border-color: #f85149; }

  /* -- locks: gold outline around the whole card -- */
  .duel.lock-card {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(212, 167, 44, .45), 0 0 16px rgba(212, 167, 44, .14);
  }

  /* -- main / co-main banners -- */
  .role-banner {
    font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
    padding: 4px 16px; border-bottom: 1px solid var(--border);
  }
  .role-banner.main {
    color: var(--gold);
    background: linear-gradient(90deg, rgba(212, 167, 44, .16), rgba(212, 167, 44, .03));
  }
  .role-banner.comain {
    color: #c9a0ff;
    background: linear-gradient(90deg, rgba(163, 113, 247, .14), rgba(163, 113, 247, .03));
  }

  /* -- cancelled fights: banner, kept in place -- */
  .duel.cancelled-fight { opacity: .75; }
  .cancel-banner {
    background: rgba(248, 81, 73, .12); color: #f85149; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 5px 16px;
  }

  /* -- off-card section (picks from other events found in the same videos) -- */
  .offcard-note {
    color: var(--muted); font-size: 12.5px; border-top: 1px dashed var(--border);
    margin-top: 26px; padding-top: 14px;
  }

  /* -- about button -- */
  button.about-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    font: inherit; font-size: 12px; border-radius: 999px; padding: 3px 12px; cursor: pointer;
  }
  button.about-btn:hover { border-color: var(--accent); color: var(--accent); }
  .legend dt { font-weight: 700; margin-top: 12px; }
  .legend dd { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }

  .sides { display: grid; grid-template-columns: 1fr 1fr; }
  .side { padding: 10px 16px 14px; border-top: 1px solid var(--border); min-width: 0; }
  .side + .side { border-left: 1px solid var(--border); }
  .side.lead { background: var(--strong-dim); }
  .side.split-side { background: var(--split-dim); }
  .side h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .side .pct { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 17px; }
  .side.lead .pct { color: var(--strong); }
  .side.split-side .pct { color: var(--split); }
  .statline { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .statline b { color: var(--text); font-variant-numeric: tabular-nums; }
  .bar { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin: 4px 0 8px; }
  .bar i { display: block; height: 100%; background: var(--weak); }
  .side.lead .bar i { background: var(--strong); }
  .side.split-side .bar i { background: var(--split); }

  ul.why { margin: 6px 0 8px; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  ul.why li { margin: 2px 0; }

  button.cappers-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 12px; border-radius: 999px; padding: 3px 12px; cursor: pointer;
  }
  button.cappers-btn:hover { border-color: var(--accent); color: var(--accent); }
  .none { color: var(--weak); font-size: 12.5px; font-style: italic; padding: 4px 0; }

  .mov-row { border-top: 1px dashed var(--border); padding: 6px 0 2px; margin-top: 6px; }
  .mov-row:first-of-type { border-top: 0; margin-top: 0; }
  .mov-row .mv-label { font-weight: 600; font-size: 13px; }

  /* -- cappers tab -- */
  .capper-row {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; margin-bottom: 8px; cursor: pointer;
  }
  .capper-row:hover { border-color: var(--accent); }
  .capper-row .rank { color: var(--weak); font-variant-numeric: tabular-nums; width: 24px; }
  .capper-row .cname { font-weight: 700; }
  .capper-row .cstat { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .capper-row .cstat b { color: var(--text); display: block; font-size: 15px; }

  /* -- parlay -- */
  .leg {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; margin-bottom: 8px; display: grid;
    grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center;
  }
  .leg .lnum {
    background: var(--panel-2); border-radius: 50%; width: 26px; height: 26px;
    display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--accent);
  }
  .leg .lmain { min-width: 0; }
  .leg .lsel { font-weight: 700; }
  .leg .lsub { color: var(--muted); font-size: 12px; }
  .leg .lstats { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .leg .lstats b { color: var(--text); }

  /* -- overlay -- */
  .overlay {
    position: fixed; inset: 0; background: rgba(2, 6, 12, .72); z-index: 50;
    display: none; align-items: flex-start; justify-content: center; padding: 40px 14px;
    overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    max-width: 760px; width: 100%; padding: 18px 20px 20px; position: relative;
  }
  .sheet h3 { margin: 0 32px 4px 0; font-size: 17px; }
  .sheet .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .sheet .close {
    position: absolute; top: 12px; right: 12px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--muted); border-radius: 8px;
    font-size: 14px; width: 30px; height: 30px; cursor: pointer;
  }
  .sheet .close:hover { color: var(--text); border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .why-cell { color: var(--muted); }
  .tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .tag.underdog { color: var(--dog); border-color: var(--dog); }
  .tag.favorite { color: var(--strong); border-color: var(--strong); }
  .table-wrap { overflow-x: auto; }
  a { color: var(--accent); }

  .pick-group { margin-bottom: 14px; }
  .pick-group h4 { margin: 0 0 4px; font-size: 14px; }
  .pick-line { padding: 5px 0 5px 12px; border-left: 2px solid var(--border); margin: 4px 0; }
  .pick-line .psel { font-weight: 600; font-size: 13.5px; }
  .pick-line .pmeta { color: var(--muted); font-size: 12px; }
  .pick-line .pwhy { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  .notice {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 16px 18px; color: var(--muted);
  }
  .notice code { color: var(--text); }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  footer details summary { cursor: pointer; }

  @media (max-width: 700px) {
    .sides { grid-template-columns: 1fr; }
    .side + .side { border-left: 0; }
    .capper-row { grid-template-columns: auto 1fr auto; }
    .capper-row .cstat.picks { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MMA <span>Consensus</span> Engine</h1>
    <div class="event-line"><div class="event" id="event-name"></div><div class="meta" id="event-meta"></div>
      <button class="about-btn" id="about-btn">? About the numbers</button></div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"><p class="notice">Loading&hellip;</p></main>
  <footer id="footer"></footer>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);

const esc = (value) =>
  String(value ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmt1 = (n) => (Math.round(n * 10) / 10).toFixed(1);

/* ---------- thresholds (shown to the user in the controls) ---------- */
const LOCK = { minShare: 75, minConf: 7.5, minPicks: 2 };
const PICKEM_MAX_SHARE = 62;

/* ---------- state ---------- */
const state = {
  data: null,
  model: null,
  tab: "ml",
  search: "",
  ml:  { sort: "card", hidePickems: false, locksOnly: false, hideNoPicks: false },
  mov: { sort: "card", hidePickems: false, locksOnly: false },
  dc:  { sort: "card", hidePickems: false, locksOnly: false },
  dog: { sort: "card" },
  parlay: { types: { ml: true, mov: true, dc: false, props: false }, legs: 3, useConf: false, minConf: 6 },
};

/* Remember the reader's tab, sorts, and filters between visits — the weekly
 * ritual shouldn't start with re-setting the same controls every time. */
const UI_STORE_KEY = "mma-consensus-ui-v1";
function persistUi() {
  try {
    const { tab, search, ml, mov, dc, dog, parlay } = state;
    localStorage.setItem(UI_STORE_KEY, JSON.stringify({ tab, search, ml, mov, dc, dog, parlay }));
  } catch { /* private mode etc. — purely a convenience */ }
}
(function restoreUi() {
  try {
    const saved = JSON.parse(localStorage.getItem(UI_STORE_KEY) || "null");
    if (!saved) return;
    for (const key of ["tab", "search"]) if (typeof saved[key] === "string") state[key] = saved[key];
    for (const key of ["ml", "mov", "dc", "dog", "parlay"]) {
      if (saved[key] && typeof saved[key] === "object") Object.assign(state[key], saved[key]);
    }
  } catch { /* corrupt store — defaults are fine */ }
})();

/* ---------- model building ---------- */
const lastToken = (name) =>
  (name || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").trim().split(/\s+/).pop() || "";

function sideOfSelection(fight, selection) {
  const s = (selection || "").toLowerCase();
  const ta = lastToken(fight.fighter_a), tb = lastToken(fight.fighter_b);
  const hasA = ta && s.includes(ta), hasB = tb && s.includes(tb);
  if (hasA && !hasB) return "a";
  if (hasB && !hasA) return "b";
  // fall back to any-token match on the full name
  const anyTok = (full) => (full || "").toLowerCase().split(/\s+/).some((t) => t.length > 3 && s.includes(t));
  if (anyTok(fight.fighter_a) && !anyTok(fight.fighter_b)) return "a";
  if (anyTok(fight.fighter_b) && !anyTok(fight.fighter_a)) return "b";
  return null;
}

function majorityRole(cappers) {
  const counts = {};
  for (const c of cappers || []) counts[c.role] = (counts[c.role] || 0) + 1;
  if ((counts.underdog || 0) > (counts.favorite || 0)) return "underdog";
  if ((counts.favorite || 0) > (counts.underdog || 0)) return "favorite";
  return "unknown";
}

function methodShort(selection) {
  const s = (selection || "").toLowerCase();
  if (/(ko|tko|knock)/.test(s)) return "KO/TKO";
  if (/(sub|choke|tap|armbar|guillotine|kimura)/.test(s)) return "SUB";
  if (/(dec|cards|judges|points)/.test(s)) return "DEC";
  if (/inside the distance|finish|stoppage/.test(s)) return "Inside distance";
  const round = s.match(/round\s*(\d)/);
  if (round) return "R" + round[1];
  return null;
}

function buildModel(data) {
  const fights = (data.fights || []).map((f, index) => {
    const markets = {};
    for (const m of f.markets || []) markets[m.bet_type] = m;

    const ml = { a: null, b: null, other: [] };
    for (const o of markets.moneyline?.options || []) {
      const side = sideOfSelection(f, o.selection);
      if (side && !ml[side]) ml[side] = o; else ml.other.push(o);
    }
    const mov = { a: [], b: [], other: [] };
    for (const o of markets.method_of_victory?.options || []) {
      const side = sideOfSelection(f, o.selection);
      (side ? mov[side] : mov.other).push(o);
    }
    const props = [];
    for (const type of ["over_under", "round", "prop"]) {
      for (const o of markets[type]?.options || []) props.push({ ...o, bet_label: markets[type].label });
    }

    // underdog side, judged by how the cappers framed their moneyline picks
    let dogSide = null;
    for (const side of ["a", "b"]) {
      const backers = [...(ml[side]?.cappers || []), ...mov[side].flatMap((o) => o.cappers || [])];
      if (majorityRole(backers) === "underdog") dogSide = side;
    }

    return { ...f, cardIndex: index, ml, mov, props, dogSide };
  });

  // Main / co-main from the official card's bout order: the highest order is
  // the last fight of the night — the main event — and the one below it the
  // co-main. Cancelled bouts keep their slot (a cancelled main event is
  // still the main event, just a cancelled one); off-card fights never get
  // a role. No card annotation this run -> no roles anywhere.
  const orders = fights
    .filter((f) => !isOffCard(f))
    .map((f) => f.card_order)
    .filter(Number.isFinite);
  const maxOrder = orders.length ? Math.max(...orders) : null;
  for (const f of fights) {
    f.cardRole = maxOrder != null && !isOffCard(f) && Number.isFinite(f.card_order)
      ? (f.card_order === maxOrder ? "main" : f.card_order === maxOrder - 1 ? "comain" : null)
      : null;
  }
  return { fights };
}

/* ---------- ML side stats ---------- */
function mlShare(fight, side) {
  const opt = fight.ml[side];
  if (!opt) return 0;
  return opt.consensus_pct;
}
function mlLead(fight) {
  const a = mlShare(fight, "a"), b = mlShare(fight, "b");
  if (!fight.ml.a && !fight.ml.b) return null;
  const side = a >= b ? "a" : "b";
  return { side, share: Math.max(a, b), opt: fight.ml[side] };
}
function isLock(share, opt) {
  return opt && share >= LOCK.minShare && opt.avg_confidence >= LOCK.minConf && opt.pick_count >= LOCK.minPicks;
}
function isPickem(fight) {
  const lead = mlLead(fight);
  if (!lead) return false;
  const other = lead.side === "a" ? fight.ml.b : fight.ml.a;
  return !!other && lead.share < PICKEM_MAX_SHARE;
}

/* ---------- reasoning bullets ---------- */
function shortWhy(text, max = 140) {
  let t = (text || "").trim();
  if (!t) return "";
  const sentence = t.match(/^.{20,}?[.!?](\s|$)/);
  if (sentence && sentence[0].length <= max) t = sentence[0].trim();
  if (t.length > max) t = t.slice(0, max - 1).replace(/\s+\S*$/, "") + "…";
  return t;
}
function bullets(cappers, cap = 3) {
  const ranked = [...(cappers || [])]
    .sort((x, y) => y.trust * y.confidence - x.trust * x.confidence)
    .map((c) => shortWhy(c.reasoning)).filter(Boolean);
  const seen = new Set(), out = [];
  for (const b of ranked) {
    const key = b.toLowerCase().slice(0, 60);
    if (seen.has(key)) continue;
    seen.add(key); out.push(b);
    if (out.length >= cap) break;
  }
  return out;
}

/* ---------- overlay ---------- */
function openOverlay(html) {
  $("#sheet").innerHTML = `<button class="close" aria-label="Close">&times;</button>` + html;
  $("#overlay").classList.add("open");
}
function closeOverlay() { $("#overlay").classList.remove("open"); }
$("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay" || e.target.classList.contains("close")) closeOverlay(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

function capperTable(cappers) {
  const rows = (cappers || []).map((c) => `
    <tr>
      <td>${esc(c.name)}</td>
      <td class="num">${esc(c.confidence)}/10</td>
      <td class="num">${esc(c.trust)}</td>
      <td>${c.role && c.role !== "unknown" ? `<span class="tag ${esc(c.role)}">${esc(c.role)}</span>` : ""}</td>
      <td class="num">${esc(c.odds || "—")}</td>
      <td class="why-cell">${esc(c.reasoning || "")}</td>
    </tr>`).join("");
  return `<div class="table-wrap"><table>
    <thead><tr><th>Capper</th><th>Conf</th><th>Trust</th><th>Framed as</th><th>Odds</th><th>Stated reasoning</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

const overlayPayloads = [];
function capperBtn(title, subtitle, cappers) {
  if (!cappers || !cappers.length) return "";
  const id = overlayPayloads.length;
  overlayPayloads.push({ title, subtitle, cappers });
  const label = cappers.length === 1 ? "1 capper" : `${cappers.length} cappers`;
  return `<button class="cappers-btn" data-ov="${id}">${label} — names</button>`;
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-ov]");
  if (!btn) return;
  const p = overlayPayloads[Number(btn.dataset.ov)];
  if (p) openOverlay(`<h3>${esc(p.title)}</h3><div class="sub">${esc(p.subtitle)}</div>${capperTable(p.cappers)}`);
});

/* ---------- shared controls ---------- */
function controlsHtml(key, { sorts = true, filters = true, noPicksToggle = false } = {}) {
  const s = state[key];
  return `<div class="controls" data-ctl="${key}">
    ${sorts ? `<label>Sort
      <select data-ctl-sort>
        <option value="card"${s.sort === "card" ? " selected" : ""}>Earliest → latest (main event last)</option>
        <option value="card-desc"${s.sort === "card-desc" ? " selected" : ""}>Latest → earliest (main event first)</option>
        <option value="conf"${s.sort === "conf" ? " selected" : ""}>Confidence (high → low)</option>
      </select></label>` : ""}
    <label>Find <input type="search" data-ctl-search placeholder="fighter name…" value="${esc(state.search)}"></label>
    ${filters ? `
    <label><input type="checkbox" data-ctl-pickems${s.hidePickems ? " checked" : ""}> Hide pick&rsquo;ems <span class="hint">(&lt;${PICKEM_MAX_SHARE}% lead)</span></label>
    <label><input type="checkbox" data-ctl-locks${s.locksOnly ? " checked" : ""}> Locks only <span class="hint">(&ge;${LOCK.minShare}% share, conf &ge;${LOCK.minConf}, &ge;${LOCK.minPicks} cappers)</span></label>` : ""}
    ${noPicksToggle ? `
    <label><input type="checkbox" data-ctl-nopicks${s.hideNoPicks ? " checked" : ""}> Hide fights without picks</label>` : ""}
  </div>`;
}
document.addEventListener("change", (e) => {
  const box = e.target.closest("[data-ctl]");
  if (!box) return;
  const s = state[box.dataset.ctl];
  if (e.target.matches("[data-ctl-sort]")) s.sort = e.target.value;
  if (e.target.matches("[data-ctl-pickems]")) s.hidePickems = e.target.checked;
  if (e.target.matches("[data-ctl-locks]")) s.locksOnly = e.target.checked;
  if (e.target.matches("[data-ctl-nopicks]")) s.hideNoPicks = e.target.checked;
  render();
});
// The search box re-renders per keystroke, which replaces the input element —
// so focus and caret are put back afterwards or typing would stop at one char.
document.addEventListener("input", (e) => {
  if (!e.target.matches("[data-ctl-search]")) return;
  state.search = e.target.value;
  render();
  const input = document.querySelector("[data-ctl-search]");
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
});

/** Fighter-name filter: any token of either name starts with the query. */
function matchesSearch(fight) {
  const query = state.search.trim().toLowerCase();
  if (!query) return true;
  return String(fight.display ?? "").toLowerCase().includes(query);
}

function sortFights(fights, mode, confOf) {
  const list = [...fights];
  if (mode === "conf") {
    list.sort((x, y) => confOf(y) - confOf(x));
  } else {
    // The official card's bout order (0 = first fight of the night, from
    // ESPN — see event_card.py). "card" reads earliest → latest so the main
    // event lands at the bottom; "card-desc" is the same walk from the main
    // event down. Fights the card doesn't know (no annotation this run)
    // keep their data order, after the card.
    const orderOf = (f) => (Number.isFinite(f.card_order) ? f.card_order : 1e6 + f.cardIndex);
    list.sort((x, y) => orderOf(x) - orderOf(y));
    if (mode === "card-desc") list.reverse();
  }
  return list;
}

/* ---------- card status (see event_card.py) ---------- */
const isOffCard = (f) => f.card_status === "off_card";
const isCancelled = (f) => f.card_status === "cancelled";
const cancelBannerHtml = (f) =>
  isCancelled(f) ? `<div class="cancel-banner">Fight cancelled — no longer on the card</div>` : "";

/** Whether the fight's leading moneyline qualifies as a Lock — the same rule
 * the badge uses, shared so the gold outline can never disagree with it. */
const isLockFight = (f) => {
  const lead = mlLead(f);
  return Boolean(lead && isLock(lead.share, lead.opt));
};

const duelClass = (f) => [
  "duel",
  isCancelled(f) ? "cancelled-fight" : "",
  isLockFight(f) ? "lock-card" : "",
].filter(Boolean).join(" ");

/** The main / co-main strip (from the official card's bout order). */
const roleBannerHtml = (f) =>
  f.cardRole === "main" ? `<div class="role-banner main">★ Main Event</div>`
  : f.cardRole === "comain" ? `<div class="role-banner comain">Co-Main Event</div>`
  : "";

/** Off-card picks (a Contender Series bout in the same video) render below a
 * divider instead of impersonating fights on this event's card. */
function offCardSection(fights, cardHtml) {
  if (!fights.length) return "";
  return `<div class="offcard-note"><b>Not on this card</b> — picks for other
    events (Contender Series, other promotions) that cappers made in the same
    videos. Kept visible, but they are not part of this event.</div>`
    + fights.map(cardHtml).join("");
}

/* ---------- side rendering ---------- */
function sideClass(share, otherShare, hasPicks) {
  if (!hasPicks) return "";
  if (share >= otherShare && share >= PICKEM_MAX_SHARE) return " lead";
  if (share >= 38) return " split-side";
  return "";
}

function mlSideHtml(fight, side) {
  const opt = fight.ml[side];
  const name = side === "a" ? fight.fighter_a : fight.fighter_b;
  const other = mlShare(fight, side === "a" ? "b" : "a");
  const share = mlShare(fight, side);
  const dog = fight.dogSide === side ? ` <span class="badge dog">underdog</span>` : "";
  if (!opt) {
    return `<div class="side"><h3>${esc(name)}${dog}</h3><div class="none">No cappers on this side</div></div>`;
  }
  const why = bullets(opt.cappers);
  return `<div class="side${sideClass(share, other, true)}">
    <h3>${esc(name)} <span class="pct">${esc(share)}%</span>${dog}</h3>
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, share))}%"></i></div>
    <div class="statline">weight <b>${esc(opt.weight)}</b> &middot; avg conf <b>${esc(opt.avg_confidence)}/10</b> &middot; <b>${esc(opt.pick_count)}</b> pick${opt.pick_count === 1 ? "" : "s"}</div>
    ${why.length ? `<ul class="why">${why.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
    ${capperBtn(`${name} — moneyline`, fight.display, opt.cappers)}
  </div>`;
}

function badgesHtml(fight) {
  const lead = mlLead(fight);
  const badges = [];
  if (lead && isLock(lead.share, lead.opt)) badges.push(`<span class="badge lock">Lock</span>`);
  if (isPickem(fight)) badges.push(`<span class="badge pickem">Pick&rsquo;em</span>`);
  return badges.length ? `<span class="badges">${badges.join("")}</span>` : "";
}

/* ---------- tab: moneylines ---------- */
function renderML() {
  const s = state.ml;
  // Every bout on the official card shows here, picked or not — plus any
  // picked fight the card annotation doesn't cover (no card fetched).
  let fights = state.model.fights.filter((f) => f.ml.a || f.ml.b || (f.card_status && !isOffCard(f)));
  fights = fights.filter(matchesSearch);
  if (s.hideNoPicks) fights = fights.filter((f) => f.ml.a || f.ml.b);
  if (s.hidePickems) fights = fights.filter((f) => !isPickem(f));
  if (s.locksOnly) fights = fights.filter(isLockFight);
  fights = sortFights(fights, s.sort, (f) => mlLead(f)?.opt.avg_confidence ?? 0);

  const cardHtml = (f) => `<article class="${duelClass(f)}">
    <h2><span>${esc(f.display)}</span>${badgesHtml(f)}</h2>
    ${roleBannerHtml(f)}${cancelBannerHtml(f)}
    <div class="sides">${mlSideHtml(f, "a")}${mlSideHtml(f, "b")}</div>
  </article>`;
  const onCard = fights.filter((f) => !isOffCard(f));
  const offCard = fights.filter(isOffCard);

  return controlsHtml("ml", { noPicksToggle: true })
    + `<div class="count-note">${onCard.length} fight${onCard.length === 1 ? "" : "s"}</div>`
    + (onCard.map(cardHtml).join("") || `<p class="notice">Nothing matches the current filters.</p>`)
    + offCardSection(offCard, cardHtml);
}

/* ---------- tab: method of victory ---------- */
function movLeadConf(fight) {
  const all = [...fight.mov.a, ...fight.mov.b];
  return all.length ? Math.max(...all.map((o) => o.avg_confidence)) : 0;
}
function movRows(fight, side, title) {
  const options = fight.mov[side];
  const name = side === "a" ? fight.fighter_a : fight.fighter_b;
  const dog = fight.dogSide === side ? ` <span class="badge dog">underdog</span>` : "";
  if (!options.length) {
    return `<div class="side"><h3>${esc(name)}${dog}</h3><div class="none">No method picks for this side</div></div>`;
  }
  const total = Math.max(...options.map((o) => o.consensus_pct));
  const rows = options.map((o) => {
    const why = bullets(o.cappers, 2);
    return `<div class="mov-row">
      <div class="mv-label">${esc(o.selection)} <span class="pct" style="font-size:14px">${esc(o.consensus_pct)}%</span></div>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, o.consensus_pct))}%"></i></div>
      <div class="statline">weight <b>${esc(o.weight)}</b> &middot; avg conf <b>${esc(o.avg_confidence)}/10</b> &middot; <b>${esc(o.pick_count)}</b> pick${o.pick_count === 1 ? "" : "s"}</div>
      ${why.length ? `<ul class="why">${why.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
      ${capperBtn(o.selection, fight.display, o.cappers)}
    </div>`;
  }).join("");
  return `<div class="side${total >= PICKEM_MAX_SHARE ? " lead" : ""}"><h3>${esc(name)}${dog}</h3>${rows}</div>`;
}
function renderMOV() {
  const s = state.mov;
  let fights = state.model.fights.filter((f) => f.mov.a.length || f.mov.b.length);
  fights = fights.filter(matchesSearch);
  if (s.hidePickems) fights = fights.filter((f) => !isPickem(f));
  if (s.locksOnly) fights = fights.filter((f) => {
    const best = [...f.mov.a, ...f.mov.b].sort((x, y) => y.consensus_pct - x.consensus_pct)[0];
    return best && isLock(best.consensus_pct, best);
  });
  fights = sortFights(fights, s.sort, movLeadConf);

  const cardHtml = (f) => `<article class="${duelClass(f)}">
    <h2><span>${esc(f.display)}</span>${badgesHtml(f)}</h2>
    ${roleBannerHtml(f)}${cancelBannerHtml(f)}
    <div class="sides">${movRows(f, "a")}${movRows(f, "b")}</div>
  </article>`;
  const onCard = fights.filter((f) => !isOffCard(f));

  return controlsHtml("mov")
    + `<div class="count-note">${onCard.length} fight${onCard.length === 1 ? "" : "s"} with method-of-victory picks</div>`
    + (onCard.map(cardHtml).join("") || `<p class="notice">Nothing matches the current filters.</p>`)
    + offCardSection(fights.filter(isOffCard), cardHtml);
}

/* ---------- tab: double chance (top-2 methods pooled) ---------- */
function doubleChance(fight, side) {
  const options = [...fight.mov[side]].sort((x, y) => y.weight - x.weight);
  if (!options.length) return null;
  const top = options.slice(0, 2);
  const picks = top.reduce((n, o) => n + o.pick_count, 0);
  const weight = top.reduce((n, o) => n + o.weight, 0);
  const share = Math.min(100, top.reduce((n, o) => n + o.consensus_pct, 0));
  const conf = picks ? top.reduce((n, o) => n + o.avg_confidence * o.pick_count, 0) / picks : 0;
  const cappers = top.flatMap((o) => o.cappers || []);
  const methods = top.map((o) => methodShort(o.selection) || o.selection);
  const name = side === "a" ? fight.fighter_a : fight.fighter_b;
  const label = methods.length === 2 ? `${methods[0]} or ${methods[1]}` : `${methods[0]} <span class="hint">(only method picked)</span>`;
  return { name, label, share: Math.round(share * 10) / 10, weight: Math.round(weight * 100) / 100, conf: Math.round(conf * 10) / 10, picks, cappers };
}
function dcSideHtml(fight, side) {
  const dc = doubleChance(fight, side);
  const name = side === "a" ? fight.fighter_a : fight.fighter_b;
  const dog = fight.dogSide === side ? ` <span class="badge dog">underdog</span>` : "";
  if (!dc) return `<div class="side"><h3>${esc(name)}${dog}</h3><div class="none">No method picks for this side</div></div>`;
  const other = doubleChance(fight, side === "a" ? "b" : "a");
  const why = bullets(dc.cappers, 2);
  return `<div class="side${sideClass(dc.share, other ? other.share : 0, true)}">
    <h3>${esc(dc.name)} <span class="pct">${esc(dc.share)}%</span>${dog}</h3>
    <div class="mv-label">${dc.label}</div>
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, dc.share))}%"></i></div>
    <div class="statline">weight <b>${esc(dc.weight)}</b> &middot; avg conf <b>${esc(dc.conf)}/10</b> &middot; <b>${esc(dc.picks)}</b> pick${dc.picks === 1 ? "" : "s"}</div>
    ${why.length ? `<ul class="why">${why.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
    ${capperBtn(`${dc.name} — double chance (${dc.label.replace(/<[^>]*>/g, "")})`, fight.display, dc.cappers)}
  </div>`;
}
function renderDC() {
  const s = state.dc;
  let fights = state.model.fights.filter((f) => f.mov.a.length || f.mov.b.length);
  fights = fights.filter(matchesSearch);
  if (s.hidePickems) fights = fights.filter((f) => !isPickem(f));
  if (s.locksOnly) fights = fights.filter((f) => {
    const best = [doubleChance(f, "a"), doubleChance(f, "b")].filter(Boolean).sort((x, y) => y.share - x.share)[0];
    return best && best.share >= LOCK.minShare && best.conf >= LOCK.minConf && best.picks >= LOCK.minPicks;
  });
  fights = sortFights(fights, s.sort, (f) =>
    Math.max(...[doubleChance(f, "a"), doubleChance(f, "b")].filter(Boolean).map((d) => d.conf), 0));

  const cardHtml = (f) => `<article class="${duelClass(f)}">
    <h2><span>${esc(f.display)}</span>${badgesHtml(f)}</h2>
    ${roleBannerHtml(f)}${cancelBannerHtml(f)}
    <div class="sides">${dcSideHtml(f, "a")}${dcSideHtml(f, "b")}</div>
  </article>`;
  const onCard = fights.filter((f) => !isOffCard(f));

  return controlsHtml("dc")
    + `<div class="count-note">Each fighter&rsquo;s two most-backed methods pooled together</div>`
    + (onCard.map(cardHtml).join("") || `<p class="notice">Nothing matches the current filters.</p>`)
    + offCardSection(fights.filter(isOffCard), cardHtml);
}

/* ---------- tab: underdogs ---------- */
function renderDogs() {
  const s = state.dog;
  let fights = state.model.fights.filter((f) => f.dogSide).filter(matchesSearch);
  fights = sortFights(fights, s.sort, (f) => f.ml[f.dogSide]?.avg_confidence ?? movLeadConf(f));

    const sections = [];

        ${why.length ? `<ul class="why">${why.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}

        <div class="statline">weight <b>${esc(o.weight)}</b> &middot; avg conf <b>${esc(o.avg_confidence)}/10</b> &middot; <b>${esc(o.pick_count)}</b> pick${o.pick_count === 1 ? "" : "s"}</div>
        ${capperBtn(o.selection, f.display, o.cappers)}

    }
    if (dc && dc.picks > 1) {

        <h3>Double chance</h3>

        <div class="statline">weight <b>${esc(dc.weight)}</b> &middot; avg conf <b>${esc(dc.conf)}/10</b> &middot; <b>${esc(dc.picks)}</b> picks</div>
      </div>`);
    }
    return `<article class="${duelClass(f)}">
      <h2><span>${esc(name)} <span class="badge dog">underdog</span> <span class="meta">— ${esc(f.display)}</span></span>${badgesHtml(f)}</h2>
      ${roleBannerHtml(f)}${cancelBannerHtml(f)}
      <div class="sides" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${sections.join("")}</div>
    </article>`;
  };
  const onCard = fights.filter((f) => !isOffCard(f));

  return controlsHtml("dog", { filters: false })
    + `<div class="count-note">Fights where cappers backed the underdog (by their own framing)</div>`
    + (onCard.map(cardHtml).join("") || `<p class="notice">No underdog picks in this event&rsquo;s data.</p>`)
    + offCardSection(fights.filter(isOffCard), cardHtml);
}

/* ---------- tab: cappers ---------- */
function aggregateCappers() {
  const map = new Map();
  for (const f of state.model.fights) {
    for (const m of f.markets || []) {
      for (const o of m.options || []) {
        for (const c of o.cappers || []) {
          if (!map.has(c.id)) map.set(c.id, { id: c.id, name: c.name, weight: 0, picks: [], maxTrust: 0 });
          const entry = map.get(c.id);
          entry.weight += c.trust * (c.confidence / 10);
          entry.maxTrust = Math.max(entry.maxTrust, c.trust);
          entry.picks.push({
            fight: f.display, market: m.label, selection: o.selection,
            confidence: c.confidence, odds: c.odds, role: c.role,
            why: shortWhy(c.reasoning, 110), video_url: c.video_url,
          });
        }
      }
    }
  }
  return [...map.values()].sort((x, y) => y.weight - x.weight);
}
function renderCappersTab() {
  const cappers = aggregateCappers();
  const rows = cappers.map((c, i) => `
    <div class="capper-row" data-capper="${esc(c.id)}">
      <span class="rank">${i + 1}</span>
      <span class="cname">${esc(c.name)}</span>
      <span class="cstat picks"><b>${c.picks.length}</b>picks</span>
      <span class="cstat"><b>${fmt1(c.weight)}</b>total weight</span>
    </div>`).join("");
  return `<div class="count-note">Ordered by total weight contributed (trust &times; confidence across all picks). Click a capper for their full card.</div>` + rows;
}
document.addEventListener("click", (e) => {
  const row = e.target.closest("[data-capper]");
  if (!row) return;
  const capper = aggregateCappers().find((c) => c.id === row.dataset.capper);
  if (!capper) return;
  const groups = new Map();
  for (const p of capper.picks) {
    if (!groups.has(p.fight)) groups.set(p.fight, []);
    groups.get(p.fight).push(p);
  }
  const body = [...groups.entries()].map(([fight, picks]) => `
    <div class="pick-group"><h4>${esc(fight)}</h4>
      ${picks.map((p) => `<div class="pick-line">
        <div class="psel">${esc(p.selection)} <span class="tag">${esc(p.market)}</span>
          ${p.role && p.role !== "unknown" ? `<span class="tag ${esc(p.role)}">${esc(p.role)}</span>` : ""}</div>
        <div class="pmeta">confidence ${esc(p.confidence)}/10${p.odds ? ` &middot; odds ${esc(p.odds)}` : ""}</div>
        ${p.why ? `<div class="pwhy">${esc(p.why)}</div>` : ""}
      </div>`).join("")}
    </div>`).join("");
  openOverlay(`<h3>${esc(capper.name)}</h3>
    <div class="sub">${capper.picks.length} picks &middot; total weight ${fmt1(capper.weight)}</div>${body}`);
});

/* ---------- tab: parlay builder ---------- */
function parlayCandidates() {
  const p = state.parlay;
  const legs = [];
  for (const f of state.model.fights) {
    // A cancelled bout can't be a parlay leg, and an off-card pick belongs
    // to a different event than the parlay being built.
    if (isCancelled(f) || isOffCard(f)) continue;
    const perFight = [];
    if (p.types.ml) {
      const lead = mlLead(f);
      if (lead && lead.opt) perFight.push({
        fight: f.display, type: "Moneyline", label: lead.opt.selection,
        share: lead.share, conf: lead.opt.avg_confidence, weight: lead.opt.weight,
        picks: lead.opt.pick_count, cappers: lead.opt.cappers,
      });
    }
    if (p.types.mov) {
      const best = [...f.mov.a, ...f.mov.b, ...f.mov.other].sort((x, y) => y.weight - x.weight)[0];
      if (best) perFight.push({
        fight: f.display, type: "Method of victory", label: best.selection,
        share: best.consensus_pct, conf: best.avg_confidence, weight: best.weight,
        picks: best.pick_count, cappers: best.cappers,
      });
    }
    if (p.types.dc) {
      const best = [doubleChance(f, "a"), doubleChance(f, "b")].filter((d) => d && d.picks > 1)
        .sort((x, y) => y.weight - x.weight)[0];
      if (best) perFight.push({
        fight: f.display, type: "Double chance", label: `${best.name}: ${best.label.replace(/<[^>]*>/g, "")}`,
        share: best.share, conf: best.conf, weight: best.weight, picks: best.picks, cappers: best.cappers,
      });
    }
    if (p.types.props) {
      for (const o of f.props) perFight.push({
        fight: f.display, type: o.bet_label, label: o.selection,
        share: o.consensus_pct, conf: o.avg_confidence, weight: o.weight,
        picks: o.pick_count, cappers: o.cappers,
      });
    }
    let usable = perFight;
    if (p.useConf) usable = usable.filter((l) => l.conf >= p.minConf);
    if (!usable.length) continue;
    // one leg per fight — parlay legs should be independent fights
    usable.sort((x, y) => y.weight * y.conf - x.weight * x.conf);
    legs.push(usable[0]);
  }
  legs.sort((x, y) => y.weight * y.conf - x.weight * x.conf);
  return legs;
}
function renderParlay() {
  const p = state.parlay;
  const candidates = parlayCandidates();
  const chosen = candidates.slice(0, p.legs);
  const typeToggle = (key, label) =>
    `<label><input type="checkbox" data-pl-type="${key}"${p.types[key] ? " checked" : ""}> ${label}</label>`;
  const controls = `<div class="controls" id="parlay-controls">
    ${typeToggle("ml", "Moneyline")}
    ${typeToggle("mov", "Method of victory")}
    ${typeToggle("dc", "Double chance")}
    ${typeToggle("props", "Other props")}
    <label>Legs
      <select data-pl-legs>${[2,3,4,5,6,7,8].map((n) => `<option${n === p.legs ? " selected" : ""}>${n}</option>`).join("")}</select>
    </label>
    <label><input type="checkbox" data-pl-useconf${p.useConf ? " checked" : ""}> Min confidence</label>
    <label style="${p.useConf ? "" : "opacity:.4;pointer-events:none"}">
      <input type="range" min="1" max="10" step="0.5" value="${p.minConf}" data-pl-minconf>
      <b id="pl-conf-val">${p.minConf}</b>/10</label>
  </div>`;

  const legsHtml = chosen.map((l, i) => `<div class="leg">
    <span class="lnum">${i + 1}</span>
    <span class="lmain">
      <div class="lsel">${esc(l.label)}</div>
      <div class="lsub">${esc(l.type)} &middot; ${esc(l.fight)}</div>
    </span>
    <span class="lstats"><b>${esc(l.share)}%</b> consensus<br>conf <b>${esc(fmt1(l.conf))}</b>/10 &middot; weight <b>${esc(l.weight)}</b><br>${capperBtn(l.label, l.fight, l.cappers)}</span>
  </div>`).join("");

  const note = chosen.length < p.legs
    ? `<p class="notice">Only ${chosen.length} leg${chosen.length === 1 ? "" : "s"} match the current filters — loosen the confidence bar or enable more bet types.</p>`
    : "";
  return controls
    + `<div class="count-note">Best ${p.legs} legs by weight &times; confidence, max one leg per fight (${candidates.length} candidate${candidates.length === 1 ? "" : "s"} matched)</div>`
    + legsHtml + note;
}
document.addEventListener("change", (e) => {
  if (!e.target.closest("#parlay-controls")) return;
  const p = state.parlay;
  const type = e.target.closest("[data-pl-type]");
  if (type) p.types[type.dataset.plType] = e.target.checked;
  if (e.target.matches("[data-pl-legs]")) p.legs = Number(e.target.value);
  if (e.target.matches("[data-pl-useconf]")) p.useConf = e.target.checked;
  if (e.target.matches("[data-pl-minconf]")) p.minConf = Number(e.target.value);
  render();
});
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-pl-minconf]")) {
    const label = document.getElementById("pl-conf-val");
    if (label) label.textContent = e.target.value;
  }
});

/* ---------- footer ---------- */
function renderSources(sources) {
  if (!sources.length) return "";
  const rows = sources.map((s) => `
    <tr>
      <td>${esc(s.capper)}</td>
      <td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.video_id)}</a></td>
      <td>${esc(s.status)}${s.error ? ` — ${esc(shortWhy(s.error, 160))}` : ""}</td>
      <td class="num">${esc(s.pick_count)}</td>
    </tr>`).join("");
  return `<details><summary>Sources (${sources.length} videos)</summary>
    <div class="table-wrap"><table>
      <thead><tr><th>Capper</th><th>Video</th><th>Status</th><th>Picks</th></tr></thead>
      <tbody>${rows}</tbody></table></div></details>`;
}
function renderDiscovery(entries) {
  if (!entries.length) return "";
  const rows = entries.map((e) => {
    const found = (e.selected || []).map((v) => esc(v.title)).join("<br>") || "—";
    return `<tr>
      <td>${esc(e.capper)}</td>
      <td>${esc(e.status)}${e.error ? ` — ${esc(shortWhy(e.error, 160))}` : ""}</td>
      <td class="num">${esc((e.selected || []).length)}</td>
      <td class="why-cell">${found}</td>
    </tr>`;
  }).join("");
  const failed = entries.filter((e) => e.status !== "ok").length;
  return `<details><summary>Channel discovery (${entries.length} channels${failed ? `, ${failed} failed` : ""})</summary>
    <div class="table-wrap"><table>
      <thead><tr><th>Capper</th><th>Status</th><th>Used</th><th>Videos found</th></tr></thead>
      <tbody>${rows}</tbody></table></div></details>`;
}

/* ---------- about / legend ---------- */
document.getElementById("about-btn").addEventListener("click", () => openOverlay(`
  <h3>How to read these numbers</h3>
  <div class="sub">Every number comes from real capper picks, weighted by each capper's tracked record.</div>
  <dl class="legend">
    <dt>Trust (1&ndash;10)</dt>
    <dd>How good this capper's tracked record is, measured from the
    @PredictionsTracker channel's published results (ROI preferred, accuracy
    against the category's break-even rate otherwise, small samples pulled
    toward neutral). 5.0 = unproven or break-even. Scored separately for
    overall picks, underdog picks, favorite picks, and method-of-victory
    picks &mdash; a pick is weighted by the score that matches how it was made.</dd>
    <dt>weight</dt>
    <dd>Total conviction behind an option: each backing capper contributes
    <b>trust &times; (confidence &divide; 10)</b>, and the contributions are summed. A
    9-trust capper at 10/10 confidence adds 9.0; a 5-trust capper at 4/10
    adds 2.0. This is the number the consensus runs on.</dd>
    <dt>Consensus %</dt>
    <dd>This option's share of all the weight cast in its market:
    <b>option weight &divide; market total weight &times; 100</b>. 100% means every
    weighted voice that bet this market took this side &mdash; check the pick
    count to see how many voices that actually was.</dd>
    <dt>avg conf</dt>
    <dd>The backers' own stated confidence (1&ndash;10, read from their language
    and stake size in the video &mdash; a lean is ~3&ndash;5, a best bet ~9&ndash;10),
    averaged across the cappers on this option. Unweighted &mdash; it answers
    &ldquo;how sure do they say they are?&rdquo;, while weight answers &ldquo;how much
    should we care?&rdquo;.</dd>
    <dt>picks</dt>
    <dd>How many cappers back this option. One capper counts once per option
    &mdash; if they said it in two videos, only their strongest statement counts.</dd>
    <dt>Lock badge + gold outline</dt>
    <dd>&ge;${LOCK.minShare}% consensus share, avg conf &ge;${LOCK.minConf}, and at least
    ${LOCK.minPicks} cappers. Lock fights carry a gold outline around the whole
    card so they read at a glance.</dd>
    <dt>Main Event / Co-Main banners</dt>
    <dd>The last and second-to-last bouts of the official card (per ESPN's
    bout order). A cancelled main event keeps its banner — it's still the
    main event, just a cancelled one.</dd>
    <dt>Pick&rsquo;em badge</dt>
    <dd>The leading side has under ${PICKEM_MAX_SHARE}% of the weight &mdash; the cappers
    are genuinely split.</dd>
    <dt>Underdog tag</dt>
    <dd>The side most of its backers described as the betting underdog.</dd>
    <dt>Cancelled banner</dt>
    <dd>The bout was on the official card (per ESPN) and no longer is. Kept
    visible so its picks don't silently vanish, but excluded from parlays.</dd>
  </dl>`));

/* ---------- shell ---------- */
const TABS = [
  { id: "ml", label: "Moneylines", render: renderML },
  { id: "mov", label: "Method of Victory", render: renderMOV },
  { id: "dc", label: "Double Chance", render: renderDC },
  { id: "dog", label: "Underdogs", render: renderDogs },
  { id: "cappers", label: "Cappers", render: renderCappersTab },
  { id: "parlay", label: "Parlay Builder", render: renderParlay },
];

function render() {
  overlayPayloads.length = 0;
  $("#tabs").innerHTML = TABS.map((t) =>
    `<button data-tab="${t.id}" class="${state.tab === t.id ? "active" : ""}">${t.label}</button>`).join("");
  const tab = TABS.find((t) => t.id === state.tab) || TABS[0];
  $("#main").innerHTML = tab.render();
  persistUi();
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-tab]");
  if (!btn) return;
  state.tab = btn.dataset.tab;
  render();
  window.scrollTo({ top: 0 });
});

fetch(`data.json?t=${Date.now()}`)
  .then((response) => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  })
  .then((data) => {
    state.data = data;
    state.model = buildModel(data);
    const event = data.event || {};
    const generated = data.generated_at ? new Date(data.generated_at).toLocaleString() : "unknown";
    const totals = data.totals || {};
    $("#event-name").textContent = event.name || "Unnamed event";
    const card = event.card || null;
    const onCardCount = (data.fights || []).filter((f) => f.card_status && f.card_status !== "off_card").length;
    // "Sat, Aug 15 · in 3 days" from the official card's start time — the
    // countdown flips to "today" on fight day and disappears once past.
    let whenHtml = "";
    const startMs = card?.date ? Date.parse(card.date) : NaN;
    if (Number.isFinite(startMs)) {
      const dayText = new Date(startMs).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      const daysOut = Math.ceil((startMs - Date.now()) / 86400000);
      const countdown = daysOut > 1 ? ` (in ${daysOut} days)` : daysOut === 1 ? " (tomorrow)" : daysOut === 0 ? " (today!)" : "";
      whenHtml = `${esc(dayText)}${esc(countdown)} &middot; `;
    }
    $("#event-meta").innerHTML =
      whenHtml +
      (card ? `official card: ${esc(onCardCount)} bouts &middot; ` : `${esc(totals.fights ?? 0)} fights &middot; `) +
      `${esc(totals.picks ?? 0)} picks &middot; ` +
      `${esc(totals.cappers ?? 0)} cappers &middot; generated ${esc(generated)}`;
    $("#footer").innerHTML = renderSources(data.sources || []) + renderDiscovery(data.discovery || []);
    render();
  })
  .catch((error) => {
    $("#main").innerHTML = `<p class="notice">Could not load <code>data.json</code>
      (${esc(error.message)}). Run the pipeline to generate it, and serve this
      directory over HTTP (<code>python -m http.server -d docs</code>) rather than
      opening the file directly.</p>`;
  });
</script>
</body>
</html>
